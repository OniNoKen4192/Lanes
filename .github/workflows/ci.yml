name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
        include:
          # One macOS job (not the full matrix): worktrees, symlinks, and
          # path normalization are the platform-sensitive surfaces.
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Validator selftest
        run: node bin/lanes-validate.mjs selftest
      - name: Conformance suite
        run: node --test
